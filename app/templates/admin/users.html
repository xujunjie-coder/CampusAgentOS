{# 用户管理（/admin/users）：任务4 —— 功能区|列表区|分页区三段式，列表数据由 admin.js 走 /api/admin/users 增删改查 #}
{% extends "base.html" %}

{% block admin_content %}
<!-- 功能区：搜索 + 批量操作 -->
<div class="layui-form admin-toolbar">
    <div class="layui-input-wrap admin-search">
        <div class="layui-input-prefix"><i class="fas fa-search"></i></div>
        <input type="text" id="userKeyword" placeholder="按用户名搜索" autocomplete="off" class="layui-input" lay-affix="clear">
    </div>
    <button type="button" class="layui-btn" id="userSearch"><i class="fas fa-search"></i> 搜索</button>
    <button type="button" class="layui-btn layui-btn-primary" id="userReset"><i class="fas fa-undo"></i> 重置</button>
    <span class="admin-toolbar-split"></span>
    <button type="button" class="layui-btn layui-btn-normal" id="userAdd"><i class="fas fa-user-plus"></i> 新增用户</button>
    <button type="button" class="layui-btn layui-btn-danger" id="userBatchDelete"><i class="fas fa-trash-alt"></i> 批量删除</button>
    <span class="admin-toolbar-count">共 <b id="userCount">0</b> 条</span>
</div>

<!-- 列表区：静态表头 + 末列操作列，表体由 admin.js 渲染 -->
<div class="layui-card admin-card">
    <div class="layui-card-body admin-list">
        <div class="admin-table-wrap">
            <table class="layui-table" lay-size="sm">
                <colgroup>
                    <col width="52">
                    <col width="80">
                    <col>
                    <col width="110">
                    <col width="150">
                    <col width="180">
                    <col width="280">
                </colgroup>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="userCheckAll" class="admin-check-all" title="全选 / 反选"></th>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>人脸</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userBody">
                    <tr><td colspan="7" class="admin-empty">加载中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 分页区：laypage 由 admin.js 渲染 -->
<div class="admin-pager">
    <span class="admin-pager-tip"><i class="fas fa-info-circle"></i> 每页 {{ page_size }} 条</span>
    <div class="admin-pager-box" id="userPager"></div>
</div>
{% end %}
