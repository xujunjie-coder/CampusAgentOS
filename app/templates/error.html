{% extends "base.html" %}
{% block content %}
<div class="error-wrap">
    <div class="error-card">
        <div class="error-head">
            <span class="error-icon" aria-hidden="true"><i class="fas fa-exclamation-triangle"></i></span>
            <div>
                <div class="error-status">{{ status }} · 请求未能完成</div>
                <div class="error-sub">{{ site_name or "西华师范大学 · 智慧校园" }}</div>
            </div>
        </div>
        <div class="error-body">
            <p class="error-message">{{ message }}</p>
            <div class="error-meta">请求编号：<code>{{ request_id }}</code></div>
            <div class="error-actions">
                <a class="error-btn is-primary" href="/"><i class="fas fa-home"></i> 返回首页</a>
                <a class="error-btn is-secondary" href="javascript:history.back()"><i class="fas fa-arrow-left"></i> 返回上一页</a>
            </div>
        </div>
    </div>
</div>
<style>
.error-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--surface-canvas, #f4f6fa);
    box-sizing: border-box;
}
.error-card {
    width: min(500px, 94vw);
    background: #ffffff;
    border: 1px solid var(--border-subtle, #e5eaf2);
    border-top: 3px solid var(--cwnu-navy, #003087);
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    overflow: hidden;
}
.error-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 22px 14px;
    border-bottom: 1px solid #f1f5f9;
}
.error-icon {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 10px;
    background: #fdf2f4;
    color: var(--cwnu-crimson, #c41230);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
}
.error-status {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-1, #0f172a);
}
.error-sub {
    font-size: 12px;
    color: var(--ink-3, #64748b);
    margin-top: 2px;
}
.error-body {
    padding: 18px 22px 22px;
}
.error-message {
    margin: 0 0 14px;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink-2, #334155);
}
.error-meta {
    margin-bottom: 18px;
    font-size: 12px;
    color: var(--ink-4, #94a3b8);
}
.error-meta code {
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--surface-subtle, #f8fafc);
    border: 1px solid var(--border-subtle, #e5eaf2);
    color: var(--ink-2, #334155);
    font-family: Consolas, monospace;
}
.error-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.error-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
}
.error-btn.is-primary {
    background: var(--cwnu-navy, #003087);
    color: #ffffff;
}
.error-btn.is-primary:hover { background: var(--cwnu-navy-hover, #002366); }
.error-btn.is-secondary {
    background: #ffffff;
    border: 1px solid var(--border-strong, #d0d9e6);
    color: var(--ink-2, #334155);
}
.error-btn.is-secondary:hover {
    border-color: var(--cwnu-navy, #003087);
    color: var(--cwnu-navy, #003087);
    background: var(--cwnu-navy-tint, #f5f8fe);
}
.error-btn:active { transform: scale(0.98); }
</style>
{% end %}
